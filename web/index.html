<!DOCTYPE html>
<html lang="en" data-default-lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EveryoneAtOnce — which characters live in you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8; --surface:#FFFFFF; --ink:#1C1B1A; --muted:#8B8680;
    --hair:#ECE8E2; --accent:#C8553D; --accent-soft:#F3E2DC;
    --ross:#4F86C6; --rachel:#D9799B; --monica:#C8553D;
    --chandler:#5FA68B; --joey:#E0A24A; --phoebe:#8E7AC4;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --shadow:0 10px 40px rgba(28,27,26,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.55; display:flex; flex-direction:column; min-height:100vh}
  a{color:inherit}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 28px;
    font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .brand{font-weight:600; cursor:pointer; color:var(--ink)}
  .langs{display:flex; gap:4px}
  .langs button{font:inherit; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    background:none; border:none; color:var(--muted); cursor:pointer; padding:4px 8px; border-radius:6px}
  .langs button.on{color:var(--ink); background:var(--surface); box-shadow:0 0 0 1px var(--hair)}
  .langs button:disabled{opacity:.35; cursor:not-allowed}

  .wrap{flex:1; width:100%; max-width:1040px; margin:0 auto; padding:24px 28px 60px}
  .stage{flex:1; display:flex; align-items:center; justify-content:center; padding:24px}
  .narrow{width:100%; max-width:640px; margin:0 auto}
  .screen{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

  /* home hero */
  .hero{text-align:center; padding:30px 0 8px}
  .kicker{font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600}
  h1{font-family:var(--serif); font-weight:500; font-size:clamp(34px,6vw,56px); line-height:1.06; letter-spacing:-.01em; margin:16px 0 0}
  .lede{margin:18px auto 0; font-size:17px; color:#4a4742; max-width:34em}
  .sectlabel{font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:48px 0 16px}

  /* IP cards */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px}
  .ipcard{position:relative; border-radius:18px; overflow:hidden; background:var(--surface);
    box-shadow:var(--shadow); cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; text-align:left}
  .ipcard.play:hover{transform:translateY(-4px); box-shadow:0 18px 50px rgba(28,27,26,.14)}
  .ipcard .thumb{aspect-ratio:4/3; width:100%; position:relative; background:linear-gradient(135deg,#ddd,#bbb)}
  .ipcard .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .ipcard .body{padding:14px 16px 18px}
  .ipcard .t{font-family:var(--serif); font-weight:500; font-size:21px; letter-spacing:-.01em}
  .ipcard .tag{font-size:13.5px; color:var(--muted); margin-top:3px}
  .ipcard.soon{cursor:default}
  .ipcard.soon .thumb img{filter:grayscale(.85) brightness(1.02)}
  .ipcard.soon::after{content:attr(data-soon); position:absolute; top:12px; right:12px;
    background:rgba(28,27,26,.78); color:#fff; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    padding:5px 9px; border-radius:99px; backdrop-filter:blur(2px)}
  .ipcard.play .badge{position:absolute; top:12px; right:12px; background:var(--accent); color:#fff;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:5px 10px; border-radius:99px}

  /* submit */
  .submit{margin-top:14px; background:var(--surface); border:1px solid var(--hair); border-radius:18px; padding:24px}
  .submit h3{font-family:var(--serif); font-weight:500; font-size:24px}
  .submit p{color:var(--muted); font-size:15px; margin-top:6px}
  .field{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
  .field input{flex:1; min-width:220px; font:inherit; font-size:15px; padding:13px 16px;
    border:1px solid var(--hair); border-radius:12px; background:var(--bg)}
  .field input:focus{outline:none; border-color:var(--accent); background:#fff}
  .btn{font:inherit; font-weight:500; font-size:16px; cursor:pointer; background:var(--accent); color:#fff;
    border:none; border-radius:999px; padding:13px 26px; transition:transform .15s, filter .15s; white-space:nowrap}
  .btn:hover{filter:brightness(1.05); transform:translateY(-1px)}
  .btn.ghost{background:none; color:var(--ink); box-shadow:inset 0 0 0 1px var(--hair)}
  .ok{margin-top:14px; color:#3f7d5c; font-size:15px}

  /* quiz */
  .progress{height:3px; background:var(--hair); border-radius:99px; overflow:hidden}
  .progress > i{display:block; height:100%; background:var(--accent); width:0; transition:width .4s cubic-bezier(.2,.7,.2,1)}
  .qcount{margin-top:14px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .scenario{font-family:var(--serif); font-weight:500; font-size:clamp(23px,4vw,30px); line-height:1.25; margin:10px 0 26px; letter-spacing:-.01em}
  .opts{display:flex; flex-direction:column; gap:12px}
  .opt{text-align:left; font:inherit; font-size:16px; color:var(--ink); cursor:pointer; background:var(--surface);
    border:1px solid var(--hair); border-radius:14px; padding:16px 18px; display:flex; gap:14px; align-items:flex-start;
    transition:border-color .15s, box-shadow .15s, transform .08s}
  .opt:hover{border-color:#d9d3ca; box-shadow:0 6px 20px rgba(28,27,26,.06); transform:translateY(-1px)}
  .opt .dot{flex:none; width:22px; height:22px; border-radius:50%; margin-top:1px; border:1.5px solid #cfc8bf;
    display:grid; place-items:center; font-size:12px; color:#fff; transition:background .15s, border-color .15s}
  .opt.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .opt.sel .dot{background:var(--accent); border-color:var(--accent)}
  .navrow{display:flex; align-items:center; justify-content:space-between; margin-top:24px}
  .back{font:inherit; font-size:14px; color:var(--muted); background:none; border:none; cursor:pointer}
  .back:hover{color:var(--ink)}
  .back[hidden]{visibility:hidden}

  /* result */
  .rhead{display:flex; gap:20px; align-items:center; margin-bottom:8px}
  .avatar{flex:none; width:92px; height:92px; border-radius:20px; object-fit:cover; box-shadow:var(--shadow); background:var(--accent-soft)}
  .rkicker{font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .verdict{font-family:var(--serif); font-weight:500; font-size:clamp(28px,5vw,42px); line-height:1.08; margin:4px 0 2px; letter-spacing:-.01em}
  .verdict em{font-style:normal; color:var(--accent)}
  .subverdict{font-size:16px; color:#4a4742}
  .descline{font-size:15px; color:var(--muted); margin:14px 0 24px}
  .bars{display:flex; flex-direction:column; gap:13px}
  .bar{display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:center}
  .bar .av{width:34px; height:34px; border-radius:10px; object-fit:cover; background:var(--accent-soft)}
  .bar .col .row{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; margin-bottom:5px}
  .bar .nm{font-weight:500}
  .bar .pct{font-variant-numeric:tabular-nums; color:#4a4742}
  .track{height:9px; background:var(--hair); border-radius:99px; overflow:hidden}
  .fill{height:100%; width:0; border-radius:99px; transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .note{margin-top:24px; font-size:14px; color:var(--muted); background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:14px 16px}
  .footer{padding:20px 28px; text-align:center; color:var(--muted); font-size:12px}
  .loading{color:var(--muted); font-size:15px; text-align:center}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand" id="brand">EveryoneAtOnce</div>
    <div class="langs" id="langs"></div>
  </div>
  <div id="root"></div>
  <div class="footer">Probabilistic personality mixes · inferred from your answers</div>

<script>
const CHAR_COLOR = {ross:'var(--ross)',rachel:'var(--rachel)',monica:'var(--monica)',
  chandler:'var(--chandler)',joey:'var(--joey)',phoebe:'var(--phoebe)'};
const charImg = (id)=> '/img/'+id+'.png';
const DESC = {
  en:{ross:"the over-analyzing romantic who has to be right",
    rachel:"the reinventor chasing a better version of herself",
    monica:"the competitive perfectionist who runs the show",
    chandler:"the deflect-with-a-joke loyalist",
    joey:"the big-hearted, food-first ride-or-die",
    phoebe:"the unfiltered free spirit with her own cosmos"},
  zh:{ross:"凡事要争对、爱钻牛角尖的浪漫主义者",
    rachel:"不断重塑、追求更好自己的人",
    monica:"掌控全局的好胜完美主义者",
    chandler:"用段子当盾牌的忠诚伙伴",
    joey:"重情义、美食至上的铁哥们",
    phoebe:"活在自己宇宙里的率真自由灵魂"}
};
const T = {
  en:{begin:"Begin", q:"Question", of:"of", back:"Back", retake:"Retake another world",
    home_h:"Which characters<br>live in you?",
    home_lede:"You're never just one. Pick a universe and discover your personality blend — or request the world you want.",
    choose:"Choose a world", soon:"Soon", play:"Play",
    submit_h:"Don't see your world?",
    submit_p:"Tell us a show, movie, or book — we'll build the test and publish it within a day.",
    submit_ph:"e.g. Harry Potter · Succession · One Piece",
    submit_btn:"Request it", submit_ok:(n,d)=>`Thanks — we'll have “${n}” ready around ${d}.`,
    mostly:"You're mostly", with:"with a streak of",
    conf_hi:"Your answers point to a clear lead.",
    conf_mid:"A leading character — but you're a real blend.",
    conf_lo:"Remarkably balanced: a true ensemble."},
  zh:{begin:"开始", q:"第", of:"/", back:"上一题", retake:"换个宇宙再测",
    home_h:"你心里住着<br>哪些角色?",
    home_lede:"你从来不只是一个人。选一个宇宙,看看你的人格混合——或者提交你想要的作品。",
    choose:"选择一个宇宙", soon:"即将", play:"开始",
    submit_h:"没有你想要的?",
    submit_p:"告诉我们一部剧、电影或书——我们一天内做好并上线。",
    submit_ph:"比如 哈利波特 · 继承之战 · 海贼王",
    submit_btn:"提交", submit_ok:(n,d)=>`收到——“${n}” 大约 ${d} 上线。`,
    mostly:"你最像", with:"还带着一点",
    conf_hi:"你的答案指向一个明显的主导角色。",
    conf_mid:"有主导角色——但你是真正的混合体。",
    conf_lo:"出奇地均衡:一个名副其实的群像。"}
};

let LANG='en', LANGS=['en'], IPS=[], QS=[], ANS=[], idx=0, curIP=null;
const root = document.getElementById('root');
const $ = (h)=>{const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild;};
const nm = (m)=> LANG==='zh' ? m.name_zh : m.name_en;
const fallback = (img, color)=>{ img.onerror=()=>{ img.style.display='none';
  img.parentElement.style.background = `linear-gradient(135deg, ${color}, ${color}88)`; }; };

async function boot(){
  const l = await (await fetch('/api/langs')).json();
  LANGS = l.langs.length ? l.langs : ['en'];
  LANG = LANGS.includes('en') ? 'en' : (LANGS.includes('zh') ? 'zh' : LANGS[0]);
  IPS = (await (await fetch('/api/ips')).json()).ips;
  document.getElementById('brand').onclick = home;
  renderLangs();
  home();
}
function renderLangs(){
  const box=document.getElementById('langs'); box.innerHTML='';
  [['en','EN'],['zh','中文']].forEach(([code,label])=>{
    const b=document.createElement('button'); b.textContent=label;
    b.className = code===LANG?'on':''; b.disabled = !LANGS.includes(code);
    b.onclick=()=>{ if(code!==LANG){ LANG=code; renderLangs(); home(); } };
    box.appendChild(b);
  });
}

function home(){
  const t=T[LANG];
  root.innerHTML='';
  const v=$(`<div class="wrap screen">
    <div class="hero">
      <div class="kicker">EveryoneAtOnce</div>
      <h1>${t.home_h}</h1>
      <p class="lede">${t.home_lede}</p>
    </div>
    <div class="sectlabel">${t.choose}</div>
    <div class="grid" id="grid"></div>
    <div class="sectlabel">&nbsp;</div>
    <div class="submit">
      <h3>${t.submit_h}</h3>
      <p>${t.submit_p}</p>
      <div class="field">
        <input id="ipname" placeholder="${t.submit_ph}" maxlength="120" />
        <button class="btn" id="reqbtn">${t.submit_btn}</button>
      </div>
      <div class="ok" id="okmsg" hidden></div>
    </div>
  </div>`);
  const grid=v.querySelector('#grid');
  IPS.forEach(ip=>{
    const playable = ip.status==='available';
    const c=$(`<div class="ipcard ${playable?'play':'soon'}" ${playable?'':`data-soon="${t.soon}"`}>
      <div class="thumb"><img alt="${ip.title}" src="${ip.image}"></div>
      <div class="body"><div class="t">${ip.title}</div><div class="tag">${ip.tagline}</div></div>
      ${playable?`<span class="badge">${t.play}</span>`:''}
    </div>`);
    fallback(c.querySelector('img'), ip.accent||'#bbb');
    if(playable) c.onclick=()=>openIP(ip);
    grid.appendChild(c);
  });
  v.querySelector('#reqbtn').onclick=submitIP;
  root.appendChild(v);
}

async function submitIP(){
  const t=T[LANG], input=document.getElementById('ipname'), name=input.value.trim();
  if(!name){ input.focus(); return; }
  const okmsg=document.getElementById('okmsg');
  try{
    const r=await (await fetch('/api/submit_ip',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name})})).json();
    okmsg.textContent = t.submit_ok(name, r.release||''); okmsg.hidden=false; input.value='';
  }catch(e){ okmsg.textContent='—'; okmsg.hidden=false; }
}

async function openIP(ip){
  curIP=ip;
  const d=await (await fetch('/api/questions?lang='+LANG)).json();
  QS=d.questions; ANS=new Array(QS.length).fill(null); idx=0;
  question();
}

function question(){
  const t=T[LANG], q=QS[idx];
  root.innerHTML='';
  const v=$(`<div class="stage"><div class="narrow screen">
    <div class="progress"><i></i></div>
    <div class="qcount">${t.q} ${idx+1} ${t.of} ${QS.length}</div>
    <div class="scenario">${q.scenario}</div>
    <div class="opts"></div>
    <div class="navrow"><button class="back" ${idx===0?'hidden':''}>${t.back}</button></div>
  </div></div>`);
  const opts=v.querySelector('.opts');
  q.options.forEach((text,i)=>{
    const o=$(`<button class="opt ${ANS[idx]===i?'sel':''}"><span class="dot">${ANS[idx]===i?'✓':''}</span><span>${text}</span></button>`);
    o.onclick=()=>select(i); opts.appendChild(o);
  });
  v.querySelector('.back').onclick=()=>{ if(idx>0){ idx--; question(); } else { home(); } };
  root.appendChild(v);
  requestAnimationFrame(()=>{ v.querySelector('.progress > i').style.width=(idx/QS.length*100)+'%'; });
}
function select(i){
  ANS[idx]=i;
  root.querySelectorAll('.opt').forEach((el,k)=>{ el.classList.toggle('sel',k===i);
    el.querySelector('.dot').textContent = k===i?'✓':''; });
  root.querySelector('.progress > i').style.width=((idx+1)/QS.length*100)+'%';
  setTimeout(()=>{ if(idx<QS.length-1){ idx++; question(); } else { finish(); } }, 260);
}
async function finish(){
  root.innerHTML='<div class="stage"><div class="narrow screen"><p class="loading">…</p></div></div>';
  let res;
  try{ res=await (await fetch('/api/infer',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ip:curIP.id, lang:LANG, answers:ANS})})).json(); }
  catch(e){ root.innerHTML='<div class="stage"><p class="loading">Something went wrong.</p></div>'; return; }
  if(res.error){ root.innerHTML='<div class="stage"><p class="loading">'+res.error+'</p></div>'; return; }
  result(res);
}
function result(res){
  const t=T[LANG], mix=res.mix, top=mix[0], second=mix[1];
  const ratio=top.mean/(second.mean||1e-9);
  const conf= ratio>1.7 ? t.conf_hi : (ratio>1.2 ? t.conf_mid : t.conf_lo);
  root.innerHTML='';
  const v=$(`<div class="stage"><div class="narrow screen">
    <div class="rhead">
      <img class="avatar" alt="${nm(top)}" src="${charImg(top.id)}">
      <div>
        <div class="rkicker">${t.mostly}</div>
        <div class="verdict"><em>${nm(top)}</em></div>
        <div class="subverdict">${Math.round(top.mean*100)}% · ${t.with} ${nm(second)} (${Math.round(second.mean*100)}%)</div>
      </div>
    </div>
    <div class="descline">${DESC[LANG][top.id]}</div>
    <div class="bars"></div>
    <div class="note">${conf}</div>
    <div class="navrow" style="justify-content:center"><button class="btn ghost" id="retake">${t.retake}</button></div>
  </div></div>`);
  fallback(v.querySelector('.avatar'), CHAR_COLOR[top.id]);
  const bars=v.querySelector('.bars');
  mix.forEach(m=>{
    const pct=Math.round(m.mean*100);
    const b=$(`<div class="bar">
      <img class="av" alt="${nm(m)}" src="${charImg(m.id)}">
      <div class="col">
        <div class="row"><span class="nm">${nm(m)}</span><span class="pct">${pct}%</span></div>
        <div class="track"><span class="fill" style="background:${CHAR_COLOR[m.id]}"></span></div>
      </div>
    </div>`);
    fallback(b.querySelector('.av'), CHAR_COLOR[m.id]);
    bars.appendChild(b);
    requestAnimationFrame(()=>{ b.querySelector('.fill').style.width=Math.max(2,m.mean*100)+'%'; });
  });
  v.querySelector('#retake').onclick=home;
  root.appendChild(v);
}

boot();
</script>
</body>
</html>
